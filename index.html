<!DOCTYPE html>
<html lang="vi">
<head>
<title>Tạo đơn hàng</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Design read: công cụ nhập đơn nội bộ cho chủ shop đồ may handmade, dùng lặp lại mỗi ngày.
  Ngôn ngữ: tiện dụng, yên tĩnh, chữ to rõ. Native CSS (Apps Script không có build step).
  Dials: DESIGN_VARIANCE 3 / MOTION_INTENSITY 3 / VISUAL_DENSITY 6.
  Font: Be Vietnam Pro (hỗ trợ tiếng Việt đầy đủ). Icon: Phosphor (regular, 1 họ duy nhất).
  Theme: khóa light, vì popup nằm trong giao diện Google Sheets sáng và bill xuất ra phải nền sáng.
  Bo góc: ô nhập / nút / thẻ = 10px, chip danh mục = pill. Không trộn kiểu khác.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #eef0ee;
    --surface: #fbfcfb;
    --sunken: #f4f6f4;
    --line: #dfe3df;
    --line-strong: #c9cfca;
    --text: #1b1f1c;
    --muted: #59605b;
    --placeholder: #6b716d;
    --accent: #2f5d4e;
    --accent-hover: #264d40;
    --accent-soft: #e4ede9;
    --on-accent: #f8faf9;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --r: 10px;
    --shadow: 0 1px 2px rgb(47 93 78 / .06), 0 4px 14px rgb(47 93 78 / .06);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.45; color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  input, select, button, textarea { font: inherit; color: inherit; }
  .ph { line-height: 1; }

  /* ---------- Controls ---------- */
  .field { display: grid; gap: 4px; min-width: 0; }
  .field > label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .input {
    width: 100%; height: 36px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: var(--r);
    background: #fff; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: var(--placeholder); }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  select.input { padding-right: 28px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    height: 38px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line-strong);
    background: #fff; cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover { border-color: var(--text); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn .ph { font-size: 17px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-quiet:hover { border-color: transparent; background: var(--sunken); color: var(--text); }
  .icon-btn {
    width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { background: var(--sunken); color: var(--text); }
  .icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
  .icon-btn .ph { font-size: 17px; }

  /* ---------- POS layout ---------- */
  .pos { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: 100vh; }
  .catalog { display: flex; flex-direction: column; min-width: 0; padding: 16px 16px 0 18px; }
  .search { position: relative; }
  .search .ph { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--muted); pointer-events: none; }
  .search .input { height: 42px; padding-left: 38px; font-size: 15px; }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 14px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong);
    background: transparent; cursor: pointer; font-weight: 500; color: var(--muted);
  }
  .chip:hover { color: var(--text); border-color: var(--text); }
  .chip.on { background: var(--text); border-color: var(--text); color: var(--surface); }
  .chip .n { font-weight: 400; opacity: .7; margin-left: 4px; }

  .grid {
    flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px; align-content: start; padding-bottom: 18px;
  }
  .card {
    position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
    border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer;
    transition: border-color .15s, box-shadow .2s var(--ease), transform .1s;
  }
  .card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .card:active { transform: scale(.98); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .th { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--sunken); }
  .card .body { padding: 9px 10px 11px; display: grid; gap: 3px; }
  .card .nm { font-weight: 500; font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 35px; }
  .card .pr { font-weight: 700; font-size: 14px; }
  .card .meta { font-size: 11.5px; color: var(--muted); }
  .card .meta.out { color: var(--danger); }
  .card.in-cart { border-color: var(--accent); }
  .card.noimg .body { flex: 1; grid-template-rows: 1fr auto auto; padding: 14px 12px 12px; min-height: 120px; }
  .card.noimg .nm { font-size: 14.5px; -webkit-line-clamp: 4; min-height: 0; padding-right: 30px; }
  .card.noimg .pr { font-size: 15px; }
  .line.noimg { grid-template-columns: minmax(0, 1fr); }
  .badge {
    position: absolute; top: 8px; right: 8px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px;
    display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 12.5px; font-weight: 700;
  }
  /* ảnh chữ cái khi SP chưa có ảnh: 1 tông trung tính, không dùng nhiều màu */
  .ph-tile { display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; letter-spacing: .02em; }
  .card .ph-tile { font-size: 26px; display: grid; }

  .skeleton { border-radius: var(--r); background: linear-gradient(90deg, var(--sunken) 0%, #e9ece9 50%, var(--sunken) 100%); background-size: 200% 100%; }
  .sk-card { aspect-ratio: 1 / 1.38; }
  @media (prefers-reduced-motion: no-preference) { .skeleton { animation: sh 1.4s linear infinite; } }
  @keyframes sh { to { background-position: -200% 0; } }

  .empty { grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: var(--muted); }
  .empty .ph { font-size: 32px; display: block; margin: 0 auto 10px; color: var(--line-strong); }
  .empty b { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }

  /* ---------- Order panel ---------- */
  .order { display: flex; flex-direction: column; height: 100vh; background: var(--surface); border-left: 1px solid var(--line); }
  .block { padding: 12px 16px 14px; }
  .block + .block { border-top: 1px solid var(--line); }
  .block-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .block-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .tag { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; }
  .tag.old { background: var(--accent-soft); color: var(--accent); }
  .tag.new { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
  .tag.busy { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
  .tag.warn { background: #fdf3e1; color: #8a5a12; }
  .dotspin { width: 10px; height: 10px; border-radius: 999px; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ac { position: relative; }
  .aclist { position: absolute; left: 0; top: 100%; margin-top: 4px; z-index: 12; width: max(100%, 300px); max-height: 300px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 12px 28px rgb(27 31 28 / .16); padding: 4px; }
  .acitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .acitem.on, .acitem:hover { background: var(--accent-soft); }
  .acitem b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acitem .ph2 { color: var(--muted); font-size: 12.5px; }
  .acitem .meta2 { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .acitem mark { background: #f6e7b8; color: inherit; border-radius: 3px; padding: 0 1px; }
  .acempty { padding: 10px; color: var(--muted); font-size: 12.5px; }
  .suggest { margin-top: 8px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .suggest b { color: var(--text); }
  .suggest button { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .g2 .full { grid-column: 1 / -1; }

  .cart { flex: 1; overflow-y: auto; padding: 4px 16px; border-top: 1px solid var(--line); }
  .cart-head { position: sticky; top: 0; background: var(--surface); padding: 10px 0 6px; display: flex; justify-content: space-between; align-items: center; z-index: 1; }
  .cart-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .line { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 10px 0; }
  .line + .line { border-top: 1px solid var(--line); }
  .line .lt { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--sunken); }
  .line .ph-tile { font-size: 15px; border-radius: 8px; }
  .lrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lname { font-weight: 500; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lactions { display: flex; flex: none; }
  .lcontrols { display: grid; grid-template-columns: 104px auto 1fr; align-items: center; gap: 8px; margin-top: 6px; }
  .lprice { height: 32px !important; padding: 0 8px !important; text-align: right; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; height: 32px; background: #fff; }
  .stepper button { width: 28px; height: 100%; border: 0; background: transparent; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
  .stepper button:hover { color: var(--text); background: var(--sunken); }
  .stepper input { width: 34px; height: 100%; border: 0; text-align: center; outline: none; background: transparent; font-weight: 600; }
  .lamt { text-align: right; font-weight: 600; }
  .lnote { height: 32px !important; margin-top: 6px; font-size: 13px; }
  .cart .empty { padding: 36px 8px; }

  .pay { border-top: 1px solid var(--line); padding: 12px 16px 14px; background: var(--surface); }
  .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 8px; }
  .g3 .input { padding: 0 9px; }
  .g3 input[type=date] { padding: 0 6px; font-size: 13px; }
  .g3 select.input { padding: 0 2px 0 7px; font-size: 13px; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .lab-row { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .lab-row label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .quick { display: flex; gap: 3px; }
  .cocf { grid-column: 1 / -1; }
  .note2 { grid-column: span 2; }
  .coc-row { display: grid; grid-template-columns: auto minmax(90px, 1fr) auto; gap: 8px; align-items: center; }
  .coc-row .quick button { height: 30px; padding: 0 9px; font-size: 12px; border-radius: 8px; }
  .cocmode { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 9px; padding: 2px; height: 36px; }
  .cocmode button { padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .cocmode button.on { background: var(--accent); color: var(--on-accent, #fff); }
  .trow.req { color: #8a5a12; font-weight: 600; }
  #bill .req td { color: #8a5a12; font-weight: 600; }
  #bill .bank .tag-req { justify-self: start; white-space: nowrap; display: inline-block; margin-bottom: 2px; padding: 2px 8px; border-radius: 999px; background: #fdf3e1; color: #8a5a12; font-weight: 700; font-size: 11.5px; }
  .quick button { height: 18px; padding: 0 6px; font-size: 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .quick button:hover { color: var(--text); border-color: var(--text); }
  .totals { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
  .trow { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); }
  .trow.grand { color: var(--text); font-size: 20px; font-weight: 700; margin-top: 2px; }
  .trow.remain { color: var(--accent); font-weight: 600; }
  .actions { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 10px; }
  .actions .btn-primary { height: 44px; font-size: 15px; }
  .actions .btn-quiet { height: 44px; }

  /* ---------- Bill view ---------- */
  .billview { height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  .billbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .billbar .spacer { flex: 1; }
  .billbar .saved { font-size: 12.5px; color: var(--muted); }
  .billbar .saved a { color: var(--accent); font-weight: 500; }
  .billwrap { flex: 1; overflow: auto; padding: 28px 16px; display: flex; justify-content: center; align-items: flex-start; }

  #bill { width: 440px; max-width: 100%; background: #fff; padding: 28px 26px 22px; border-radius: 12px; box-shadow: var(--shadow); color: var(--text); font-size: 13px; }
  #bill .head { text-align: center; }
  #bill .logo { max-width: 76px; max-height: 76px; display: block; margin: 0 auto 10px; border-radius: 10px; }
  #bill .shop { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  #bill .contact { color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.55; }
  #bill .title { margin: 18px 0 14px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); display: flex; justify-content: space-between; align-items: baseline; }
  #bill .title b { color: var(--accent); font-size: 14px; }
  #bill .title span { color: var(--muted); font-size: 12px; }
  #bill table { width: 100%; border-collapse: collapse; }
  #bill .meta td { padding: 3px 0; vertical-align: top; }
  #bill .meta td:first-child { color: var(--muted); width: 88px; }
  #bill .meta td:last-child { font-weight: 500; }
  #bill .items { margin-top: 14px; }
  #bill .items td { padding: 10px 0; vertical-align: top; border-top: 1px solid var(--line); }
  #bill .bi { width: 54px; }
  #bill .bi img, #bill .bi .ph-tile { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; font-size: 14px; }
  #bill .bn { font-weight: 500; }
  #bill .bnote { color: var(--muted); font-size: 12px; margin-top: 1px; }
  #bill .bq { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #bill .r { text-align: right; white-space: nowrap; }
  #bill .amt { font-weight: 600; }
  #bill .tots { border-top: 1px solid var(--line-strong); margin-top: 2px; }
  #bill .tots td { padding: 4px 0; color: var(--muted); }
  #bill .tots tr:first-child td { padding-top: 12px; }
  #bill .tots .grand td { color: var(--text); font-size: 17px; font-weight: 700; padding-top: 8px; }
  #bill .tots .remain td { color: var(--accent); font-size: 15px; font-weight: 700; }
  #bill .note { margin-top: 12px; color: var(--muted); }
  #bill .note b { color: var(--text); font-weight: 500; }
  #bill .bank { margin-top: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 2px; }
  #bill .bank .k { color: var(--muted); font-size: 12px; }
  #bill .bank.has-qr { grid-template-columns: 116px minmax(0, 1fr); gap: 14px; align-items: center; }
  #bill .bank .qr { width: 116px; height: 116px; padding: 0; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  #bill .bank .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #bill .bank-info { display: grid; gap: 2px; min-width: 0; }
  #bill .bank-info b { color: var(--text); }
  #bill .bank .v { font-weight: 600; font-size: 15px; letter-spacing: .02em; }
  #bill .foot { margin-top: 18px; text-align: center; color: var(--muted); }

  /* ---------- PIN gate ---------- */
  .pin-gate { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: var(--bg); padding: 16px; }
  .pin-box { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); display: grid; gap: 12px; }
  .pin-box h1 { margin: 0; font-size: 19px; font-weight: 700; }
  .pin-box p { margin: 0; color: var(--muted); }
  .pin-box .input { height: 44px; font-size: 18px; letter-spacing: .3em; text-align: center; }
  .pin-box .btn { height: 44px; }
  .pin-msg { color: var(--danger) !important; min-height: 1.2em; font-weight: 500; }

  /* ---------- Toast & overlay ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    max-width: min(520px, 90vw); padding: 11px 16px; border-radius: var(--r); font-weight: 500;
    background: var(--text); color: var(--surface); box-shadow: 0 8px 24px rgb(27 31 28 / .18); z-index: 30;
    transition: opacity .2s, transform .25s var(--ease);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: var(--danger); color: #fff; }
  #loading { position: fixed; inset: 0; display: none; place-items: center; background: rgb(238 240 238 / .8); z-index: 20; color: var(--muted); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  .grid { grid-auto-rows: max-content; }
  .mbar { display: none; }

  /* ---------- Sản phẩm có phân loại ---------- */
  .vtag { position: absolute; top: 8px; left: 8px; z-index: 1; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgb(255 255 255 / .92); color: var(--accent); border: 1px solid var(--line); }
  .card.noimg .vtag { position: static; justify-self: start; margin-bottom: 2px; }
  .trow.km { color: var(--accent); font-weight: 500; gap: 12px; }
  .ver { font-size: 10.5px; color: var(--muted); opacity: .7; text-align: right; margin: -4px 0 6px; }
  .loy { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); display: grid; gap: 8px; }
  .loy-line { font-size: 12.5px; color: var(--accent); line-height: 1.4; }
  .loy-line b { font-weight: 700; }
  .loy-use { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .loy-use label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .loy-use .input { height: 34px; }
  .loy-use button { height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .tier-chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: #f8faf9; font-weight: 600; font-size: 11.5px; margin-right: 4px; }
  #bill .loybox { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .trow.km #tKmName { min-width: 0; }
  .lvar { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: -2px; }
  .pk-back { position: fixed; inset: 0; z-index: 25; background: rgb(27 31 28 / .42); display: grid; place-items: center; padding: 20px; }
  .pk { width: min(780px, 100%); max-height: calc(100vh - 40px); background: var(--surface); border-radius: 18px; box-shadow: 0 24px 60px rgb(27 31 28 / .28); display: grid; grid-template-columns: 290px minmax(0, 1fr); overflow: hidden; }
  .pk-img { background: var(--sunken); position: relative; min-height: 380px; }

  .pk-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; min-width: 0; }

  .pk-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }

  .pk-stock { font-size: 13px; color: var(--muted); font-weight: 500; }

  #pkDims { display: grid; gap: 14px; }
  .pk-dim { display: grid; gap: 8px; }
  .pk-dim > span { font-size: 13px; color: var(--muted); font-weight: 500; }
  .pk-dim > span b { color: var(--text); }
  .pk-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; font: inherit; font-weight: 500; color: var(--text); cursor: pointer; }
  .opt:hover { border-color: var(--accent); }
  .opt.on { border: 2px solid var(--accent); background: var(--accent-soft); padding: 0 13px; }
  .opt.off { opacity: .5; text-decoration: line-through; }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pk-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: end; }
  .pk-row .stepper { height: 42px; }
  .pk-row .stepper button { width: 38px; }
  .pk-row .lbl { display: block; font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
  .pk-add { height: 50px; font-size: 15px; justify-content: center; margin-top: auto; width: 100%; }
  .pk-add:disabled { background: #9aa49d; border-color: #9aa49d; cursor: not-allowed; }
  body.pk-open { overflow: hidden; }

  /* ---------- Điện thoại / máy tính bảng dọc ---------- */
  @media (max-width: 860px) {
    .pos { display: block; height: auto; }
    .catalog { padding: 0 12px; }
    .search-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 0; }
    .search .input { height: 44px; font-size: 16px; }           /* 16px: iPhone không tự phóng to khi gõ */
    .cats { padding: 10px 0 12px; }
    .grid { flex: none; overflow: visible; max-height: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-bottom: 16px; }

    .g2 { grid-template-columns: 1fr; }
    .g3 { grid-template-columns: 1fr 1fr; }
    .note2 { grid-column: 1 / -1; }
    .coc-row { grid-template-columns: minmax(0, 1fr) auto; }
    .coc-row .cocmode { grid-column: 1 / -1; justify-self: start; }
    .lcontrols { grid-template-columns: 1fr auto; }
    .lcontrols .lamt { grid-column: 1 / -1; text-align: left; }
    .input, select.input { font-size: 16px; height: 42px; }

    body.has-mbar { padding-bottom: 76px; }
    .mbar {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 15;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      height: 56px; padding: 0 8px 0 16px; border-radius: 14px; border: 0;

    .pk-back { place-items: end stretch; padding: 0; }
    .pk { width: 100%; grid-template-columns: minmax(0, 1fr); border-radius: 20px 20px 0 0; max-height: 90vh; }

<!-- ============ CHỌN PHÂN LOẠI ============ -->
<div id="picker" class="pk-back" hidden>
  <div class="pk" role="dialog" aria-modal="true" aria-labelledby="pkName">

<script src="config.js"></script>
<script src="bridge.js"></script>
<script>
const BOOT = { mode: 'pos', web: true };
const INIT = { needPin: true };
let P = [], C = [], SHOP = {}, PROMOS = [], LOY = { cfg: { per: 10000, val: 200, cap: 0.5 }, tiers: [], map: {} }, CART = [], CAT = 'Tất cả', BUSY = false, CUR = null;
const IMG_CACHE = {};
const $ = id => document.getElementById(id);
const money = n => (Math.round(Number(n) || 0)).toLocaleString('vi-VN') + 'đ';
const num = v => Number(String(v == null ? '' : v).replace(/\D/g, '')) || 0;   // đọc "1.250.000" -> 1250000
const fmtNum = n => (Math.round(Number(n) || 0)).toLocaleString('vi-VN');        // 1250000 -> "1.250.000"

/* Ô nhập tiền: tự thêm dấu chấm hàng nghìn, bỏ số 0 thừa ở đầu, giữ vị trí con trỏ */
function formatMoneyInput(el) {
  const caret = el.selectionStart == null ? el.value.length : el.selectionStart;
  const digitsBefore = el.value.slice(0, caret).replace(/\D/g, '').replace(/^0+(?=\d)/, '').length;
  const digits = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  el.value = digits ? fmtNum(Number(digits)) : '';
  let pos = 0, seen = 0;
  while (pos < el.value.length && seen < digitsBefore) { if (/\d/.test(el.value[pos])) seen++; pos++; }
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('money')) formatMoneyInput(e.target); }, true);
// bấm vào ô tiền là chọn hết, gõ số mới đè lên luôn
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('money')) { el.select(); el._fresh = true; }
});
document.addEventListener('mouseup', e => {
  const el = e.target;
  if (el._fresh) { e.preventDefault(); el._fresh = false; }   // chặn cú nhả chuột làm mất vùng chọn
});
document.addEventListener('keydown', e => { if (e.target._fresh) e.target._fresh = false; }, true);
document.addEventListener('focusout', e => { const el = e.target; if (el.classList && el.classList.contains('money') && el.value === '') el.value = '0'; });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const initials = s => String(s).trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const show = (el, on) => { el.hidden = !on; };

function normPhone(v) {
  let s = String(v || '').replace(/\D/g, '');
  if (s.startsWith('84') && s.length === 11) s = '0' + s.slice(2);
  else if (s.length === 9) s = '0' + s;
  return s;
}
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = err ? 'err' : '', 3500);
}
function loading(on, text) { $('loading').style.display = on ? 'grid' : 'none'; if (text) $('loading').textContent = text; }
let PIN = '';
const GUARDED = { getInitData: 1, createOrder: 1, getBill: 1, saveBillFile: 1, lookupCustomer: 1 };
function run(fn, args, ok, fail) {
  if (GUARDED[fn]) args = args.concat([PIN]);
  google.script.run
    .withSuccessHandler(ok)
    .withFailureHandler(e => { loading(false); toast((e && e.message) || String(e), true); if (fail) fail(e); })[fn](...args);
}
function setBtn(id, icon, label, disabled) {
  const b = $(id); b.disabled = !!disabled;
  b.innerHTML = `<i class="ph ${icon}"></i><span>${label}</span>`;
}

/* ---------- ẢNH ---------- */
function phTile(name, cls) { return `<div class="${cls} ph-tile" aria-hidden="true">${esc(initials(name))}</div>`; }
function thumb(p, cls) {
  if (!p.img) return '';
  return `<img class="${cls}" loading="lazy" src="${esc(p.img.src)}" data-alt="${esc(p.img.alt || '')}" data-ref="${esc(p.img.ref)}" data-name="${esc(p.name)}" onerror="imgErr(this)" alt="${esc(p.name)}">`;
}
function imgErr(el) {
  if (el.dataset.alt) { const a = el.dataset.alt; el.dataset.alt = ''; el.src = a; return; }
  const ref = el.dataset.ref;
  if (ref && !el.dataset.tried) {
    el.dataset.tried = '1';
    if (IMG_CACHE[ref]) { el.src = IMG_CACHE[ref]; return; }
    google.script.run
      .withSuccessHandler(d => { if (d) { IMG_CACHE[ref] = d; el.src = d; } else toPh(el); })
      .withFailureHandler(() => toPh(el)).getImageData(ref);
    return;
  }
  toPh(el);
}
function toPh(el) {
  // ảnh lỗi -> bỏ ảnh, chuyển thẻ sang dạng chỉ có chữ
  const box = el.closest('.pk-img, .pk-mini');
  if (box) { box.innerHTML = phTile(el.dataset.name || '', ''); return; }
  const host = el.closest('.card, .line');
  if (host) host.classList.add('noimg');
  el.remove();
}

/* ---------- KHỞI ĐỘNG ---------- */
function applyData(d) {
  P = d.products; C = d.customers; SHOP = d.shop; PROMOS = d.promos || []; if (d.loyalty) LOY = d.loyalty;
  LAST_SYNC = Date.now();
  // lưu tạm trên trình duyệt (trang nhân viên) để lần sau mở là hiện ngay, rồi mới tải bản mới
  if (BOOT.web) try { localStorage.setItem('pos_cache', JSON.stringify({ t: Date.now(), d })); } catch (e) {}
}
function readCache() {
  try { const c = JSON.parse(localStorage.getItem('pos_cache') || 'null'); return c && Date.now() - c.t < 7 * 864e5 ? c.d : null; } catch (e) { return null; }
}
/* Lấy lại dữ liệu mới nhất (SP, tồn kho, khách, điểm) mà không mất đơn đang nhập.
   Chạy khi bấm "Đơn mới", khi quay lại cửa sổ sau 2 phút, và 5 phút/lần. */
let LAST_SYNC = 0, SYNCING = false;
function refreshData() {
  if (SYNCING || BUSY || !P.length) return;
  SYNCING = true;
  google.script.run
    .withSuccessHandler(d => { SYNCING = false; applyData(d); buildGroups(); renderCats(); renderGrid(); renderTotals(); recheckPhone(); })
    .withFailureHandler(e => {
      SYNCING = false;
      if (/PIN/.test((e && e.message) || '')) {   // PIN đã bị đổi -> hỏi lại
        try { localStorage.removeItem('pos_pin'); localStorage.removeItem('pos_cache'); } catch (x) {}
        askPin('Mã PIN đã thay đổi, nhập lại');
      }
    })
    .getInitData(PIN);
}
window.addEventListener('focus', () => { if (Date.now() - LAST_SYNC > 120000) refreshData(); });
setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - LAST_SYNC > 300000) refreshData(); }, 60000);

function initPos(d) {
  applyData(d);
  $('kenh').innerHTML = '<option value="">Chọn kênh</option>' + d.lists.KENH.map(k => `<option>${esc(k)}</option>`).join('');
  $('tt').innerHTML = d.lists.THANH_TOAN.map(k => `<option>${esc(k)}</option>`).join('');
  $('grid').removeAttribute('aria-busy');
  buildGroups(); renderCats(); renderGrid(); renderCart();
  $('q').focus();
}
/* ---------- MÃ PIN (trang nhân viên) ---------- */
function askPin(msg) {
  show($('pinGate'), true); $('pinMsg').textContent = msg || '';

  if (BOOT.web) { $('btnClose').style.display = 'none'; document.title = 'Tạo đơn hàng'; }
  if (INIT && INIT.needPin) {
    let saved = ''; try { saved = localStorage.getItem('pos_pin') || ''; } catch (e) {}
    const cache = saved && readCache();
    if (cache) { PIN = saved; initPos(cache); LAST_SYNC = 0; setTimeout(refreshData, 50); }   // hiện ngay từ bản lưu tạm, tải bản mới ngầm
    else if (saved) tryPin(saved); else askPin('');
    setTimeout(loadLibs, 1200);
    return;
  }
  if (BOOT.mode === 'bill') { show($('pos'), false); $('btnNew').style.display = 'none'; }
  if (INIT && INIT.data) {
    BOOT.mode === 'bill' ? showBill(INIT.data) : initPos(INIT.data);
  } else if (BOOT.mode === 'bill') {
    loading(true, 'Đang tải bill...'); run('getBill', [BOOT.orderId], showBill);

/* ---- VietQR (chuẩn EMVCo / NAPAS 247), tự tạo trong code ---- */
const BANK_BIN = {
  vietcombank: '970436', vcb: '970436', bidv: '970418', vietinbank: '970415', viettinbank: '970415', ctg: '970415', agribank: '970405',
  techcombank: '970407', tcb: '970407', mbbank: '970422', mb: '970422', acb: '970416', vpbank: '970432',
  tpbank: '970423', sacombank: '970403', stb: '970403', vib: '970441', shb: '970443', hdbank: '970437',
  ocb: '970448', msb: '970426', seabank: '970440', eximbank: '970431', lpbank: '970449', namabank: '970428',
  bacabank: '970409', abbank: '970425', ncb: '970419', pvcombank: '970412', kienlongbank: '970452'
};
function bankBin(s) {
  if (s.ma_bin && /^\d{6}$/.test(String(s.ma_bin).trim())) return String(s.ma_bin).trim();
  const k = String(s.ngan_hang || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z]/g, '');
  return BANK_BIN[k] || '';
}
function crc16(str) {               // CRC-16/CCITT-FALSE
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function vietqrPayload(bin, acct, amount, info) {
  const acc = tlv('00', 'A000000727') + tlv('01', tlv('00', bin) + tlv('01', acct)) + tlv('02', 'QRIBFTTA');
  let s = tlv('00', '01') + tlv('01', amount > 0 ? '12' : '11') + tlv('38', acc) + tlv('53', '704');
  if (amount > 0) s += tlv('54', String(Math.round(amount)));
  s += tlv('58', 'VN');
  if (info) s += tlv('62', tlv('08', info));
  s += '6304';
  return s + crc16(s);
}
// nội dung CK: bỏ dấu tiếng Việt và ký tự đặc biệt, giữ chữ + số + khoảng trắng, tối đa 25 ký tự
const ckInfo = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D')
  .replace(/[^A-Za-z0-9 ]/g, '').replace(/\s+/g, ' ').trim().slice(0, 25);

let QRLIB = null, QR_READY = Promise.resolve();
function loadQrLib() {
  if (QRLIB) return QRLIB;
  QRLIB = new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    s.onload = ok; s.onerror = () => { QRLIB = null; fail(new Error('Không tải được thư viện QR')); };
    document.head.appendChild(s);
  });
  return QRLIB;
}
function drawQr(b) {

  }).catch(e => { el.closest('.qr').remove(); toast(e.message, true); });

let LIBS = null;
function loadLibs() {
  if (LIBS) return LIBS;
  const load = src => new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => fail(new Error('Không tải được thư viện xuất file, kiểm tra mạng'));
    document.head.appendChild(s);
  });
  LIBS = Promise.all([
    load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  ]).catch(e => { LIBS = null; throw e; });
  return LIBS;
}

/* ---------- SẢN PHẨM ---------- */
// Gộp các SKU cùng "Nhóm SP" thành 1 thẻ. SKU không có nhóm đứng riêng như cũ.
let G = [], PK = null;
const gkey = v => String(v || '').trim().replace(/\s+/g, ' ').toLowerCase();
const tracked = p => p.track === true || (p.track === undefined && typeof p.stock === 'number' && isFinite(p.stock));
const isOut = p => tracked(p) && p.stock <= 0;
const vLabel = p => [p.color, p.size].filter(Boolean).join(', ');
const sizeWord = g => g.sizes.every(x => x.length <= 4) ? 'size' : 'quy cách';

function buildGroups() {
  const map = new Map(); G = [];
  P.forEach(p => {
    const k = p.group ? 'g:' + gkey(p.group) : 's:' + p.sku;
    let g = map.get(k);
    if (!g) { g = { key: k, group: p.group || '', cat: p.cat, v: [] }; map.set(k, g); G.push(g); }
    g.v.push(p);
  });
  G.forEach(g => {
    g.multi = g.v.length > 1;
    g.name = g.multi ? g.group : g.v[0].name;
    const prices = g.v.map(p => p.price);
    g.lo = Math.min(...prices); g.hi = Math.max(...prices);
    g.colors = [...new Set(g.v.map(p => p.color || ''))];
    g.sizes = [...new Set(g.v.map(p => p.size || ''))];
    if (g.colors.every(x => !x)) g.colors = [];
    if (g.sizes.every(x => !x)) g.sizes = [];
    g.out = g.v.every(isOut);
    const withImg = g.v.filter(p => p.img);
    g.img = (withImg.find(p => !isOut(p)) || withImg[0] || {}).img || null;
    g.skus = new Set(g.v.map(p => p.sku));
    g.hay = [g.name, ...g.v.map(p => [p.name, p.sku, p.color, p.size].join(' '))].join(' ').toLowerCase();
  });
}

function renderCats() {
  const count = {}; G.forEach(g => count[g.cat] = (count[g.cat] || 0) + 1);
  const cats = ['Tất cả', ...Object.keys(count)];
  $('cats').innerHTML = cats.map(c => {
    const n = c === 'Tất cả' ? G.length : count[c];
    return `<button class="chip ${c === CAT ? 'on' : ''}" role="tab" aria-selected="${c === CAT}" data-c="${esc(c)}">${esc(c)}<span class="n num">${n}</span></button>`;
  }).join('');
}
$('cats').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; CAT = b.dataset.c; renderCats(); renderGrid(); });

function filtered() {
  const q = $('q').value.trim().toLowerCase();
  return G.filter(g => (CAT === 'Tất cả' || g.cat === CAT) && (!q || g.hay.includes(q)));
}
function cardMeta(g) {
  if (!g.multi) {
    const p = g.v[0];
    return esc(p.sku) + (tracked(p) ? (isOut(p) ? ', hết hàng' : `, còn ${p.stock}`) : '');
  }
  const parts = [];
  if (g.colors.length) parts.push(g.colors.length + ' màu');
  if (g.sizes.length) parts.push(g.sizes.length + ' ' + sizeWord(g));
  if (!parts.length) parts.push(g.v.length + ' loại');
  return parts.join(', ') + (g.out ? ', hết hàng' : '');
}
function renderGrid() {

function pkDims(g) {
  const D = [];
  if (g.colors.length) D.push({ f: 'color', label: 'Màu / mẫu', opts: g.colors });
  if (g.sizes.length) D.push({ f: 'size', label: sizeWord(g) === 'size' ? 'Size' : 'Quy cách', opts: g.sizes });
  if (!D.length) D.push({ f: 'sku', label: 'Phân loại', opts: g.v.map(p => p.sku), text: s => g.v.find(p => p.sku === s).name });
  return D;
}
const pkVal = (p, f) => f === 'sku' ? p.sku : (p[f] || '');
function pkFind(sel) { return PK.g.v.find(p => PK.D.every(d => pkVal(p, d.f) === sel[d.f])); }
function pkSelFrom(p) { const s = {}; PK.D.forEach(d => s[d.f] = pkVal(p, d.f)); return s; }

function openPicker(g) {
  PK = { g, D: pkDims(g) };
  const first = g.v.find(p => !isOut(p)) || g.v[0];
  PK.sel = pkSelFrom(first);
  $('pkQty').value = 1; $('pkNote').value = '';
  $('picker').hidden = false; document.body.classList.add('pk-open');
  renderPicker();
  setTimeout(() => { const b = $('pkDims').querySelector('.opt.on') || $('pkAdd'); b.focus(); }, 30);
}
function closePicker() { $('picker').hidden = true; document.body.classList.remove('pk-open'); PK = null; }
function pkPick(f, val) {
  const want = { ...PK.sel, [f]: val };
  let v = pkFind(want);
  if (!v) {   // tổ hợp không tồn tại -> nhảy sang biến thể gần nhất có giá trị vừa chọn (ưu tiên còn hàng)
    const cand = PK.g.v.filter(p => pkVal(p, f) === val);
    v = cand.find(p => !isOut(p)) || cand[0];
  }
  if (v) { PK.sel = pkSelFrom(v); renderPicker(); }
}
function renderPicker() {
  const { g, D, sel } = PK;
  const v = pkFind(sel) || g.v[0];
  const img = v.img ? v : (g.img ? { img: g.img, name: g.name } : null);
  const pic = img ? thumb(img, '') : phTile(g.name, '');
  $('pkImg').innerHTML = pic; $('pkMini').innerHTML = pic;
  $('pkName').textContent = g.name;
  $('pkSku').textContent = 'SKU ' + v.sku;
  $('pkPrice').textContent = money(v.price);
  const out = isOut(v);
  $('pkStock').textContent = tracked(v) ? (out ? 'Hết hàng' : 'Còn ' + v.stock) : '';
  $('pkStock').classList.toggle('out', out);
  $('pkDims').innerHTML = D.map(d => {
    const cur = d.text ? d.text(sel[d.f]) : (sel[d.f] || '—');
    return `<div class="pk-dim"><span>${esc(d.label)}: <b>${esc(cur)}</b></span><div class="pk-opts">${d.opts.map(o => {
      const c = pkFind({ ...sel, [d.f]: o });
      const off = !c || isOut(c);
      const on = sel[d.f] === o;
      const txt = d.text ? d.text(o) : (o || '—');
      return `<button type="button" class="opt ${on ? 'on' : ''} ${off ? 'off' : ''}" data-f="${d.f}" data-v="${esc(o)}" aria-pressed="${on}"${off ? ` title="${c ? 'Hết hàng' : 'Không có tổ hợp này'}"` : ''}>${esc(txt)}</button>`;
    }).join('')}</div></div>`;
  }).join('');
  const qty = Math.max(1, Math.floor(num($('pkQty').value)) || 1);
  $('pkAdd').disabled = out;
  $('pkAdd').innerHTML = out ? 'Phân loại này đã hết hàng' : `<i class="ph ph-plus"></i><span>Thêm vào đơn, ${money(v.price * qty)}</span>`;
}
$('picker').addEventListener('click', e => {
  if (e.target === $('picker')) return closePicker();          // bấm ra ngoài
  const o = e.target.closest('.opt');
  if (o) return pkPick(o.dataset.f, o.dataset.v);

/* Combo tự áp — giống hệt comboCalc_ trong Code.gs (sửa thì sửa cả 2) */
function comboCalc(lines, promos) {
  const res = { total: 0, paid: 0, applied: [] }, groups = {};
  promos.forEach(p => (groups[p.g] = groups[p.g] || []).push(p));
  Object.keys(groups).forEach(g => {
    const units = [];
    lines.forEach(l => { if (l.g === g) for (let i = 0; i < l.qty; i++) units.push(l.price); });
    units.sort((a, b) => b - a);
    groups[g].slice().sort((a, b) => b.qty - a.qty).forEach(p => {
      let n = 0, disc = 0;
      while (units.length >= p.qty) {
        const take = units.splice(0, p.qty);
        const sum = take.reduce((s, x) => s + x, 0);
        if (sum <= p.price) { units.unshift(...take); break; }
        disc += sum - p.price; n++;
      }
      if (n) { res.applied.push({ name: p.name, n, disc }); res.total += disc; res.paid += n * p.price; }
    });
  });
  return res;
}
function calc() {
  const tamtinh = CART.reduce((s, l) => s + l.price * l.qty, 0);
  const km = comboCalc(CART.map(l => { const p = P.find(x => x.sku === l.sku); return { g: p ? gkey(p.group) : '', price: l.price, qty: l.qty }; }), PROMOS);
  const me = curLoy();
  const loy = loyaltyCalc(tamtinh - km.total, km.paid, me ? me.tier : NO_TIER, me ? num($('diem').value) : 0, me ? me.p : 0, LOY.cfg);
  const goods = loy.after - loy.ptsDisc;
  const giam = Math.min(num($('giam').value), goods);

const NO_TIER = { name: '', pct: 0, comboPct: 0, min: 0 };
function loyaltyCalc(base, comboPaid, tier, wantPts, balance, L) {
  const non = Math.max(0, base - comboPaid);
  const tierDisc = Math.round(non * tier.pct / 100 + comboPaid * tier.comboPct / 100);
  const after = base - tierDisc;
  const maxPts = Math.max(0, Math.min(Math.floor(balance), Math.floor(after * L.cap / L.val)));
  const used = Math.min(Math.max(0, Math.floor(Number(wantPts) || 0)), maxPts);
  return { tierDisc, used, ptsDisc: used * L.val, maxPts, after };
}
function tierOf(spend) { let t = null; LOY.tiers.forEach(x => { if (spend >= x.min) t = x; }); return t || NO_TIER; }
function curLoy() {
  const p = normPhone($('sdt').value);

  const o = LOY.map[p] || { s: 0, p: 0 };
  const tier = tierOf(o.s), next = LOY.tiers.find(x => x.min > o.s);
  return { phone: p, s: o.s, p: o.p, tier, next };
}

    const url = await makeFile(type);
    const a = document.createElement('a');
    a.href = url; a.download = CUR.ma + '.' + type;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Không thấy file tải về? Bấm "Lưu Drive"');
  } catch (e) { toast('Lỗi tạo file: ' + e.message, true); }
}
$('btnPng').onclick = () => download('png');
$('btnPdf').onclick = () => download('pdf');
$('btnDrive').onclick = async () => {
  if (!CUR) return;
  const reset = () => setBtn('btnDrive', 'ph-cloud-arrow-up', 'Lưu Drive');
  setBtn('btnDrive', 'ph-cloud-arrow-up', 'Đang lưu...', true);
  try {
    const png = await makeFile('png');
    const pdf = await makeFile('pdf');
    run('saveBillFile', [CUR.ma, png, 'png'], urlPng => {
      run('saveBillFile', [CUR.ma, pdf, 'pdf'], urlPdf => {
        reset(); show($('driveLink'), true);
        $('driveLink').innerHTML = `Đã lưu: <a href="${esc(urlPng)}" target="_blank">ảnh</a>, <a href="${esc(urlPdf)}" target="_blank">PDF</a>`;
        toast('Đã lưu vào Drive, link PDF ghi ở cột "Link bill"');
      }, reset);
    }, reset);
  } catch (e) { reset(); toast('Lỗi tạo file: ' + e.message, true); }
};
$('btnPrint').onclick = () => window.print();
$('btnClose').onclick = () => google.script.host.close();
$('btnNew').onclick = () => { CUR = null; show($('billView'), false); show($('pos'), true); show($('driveLink'), false); $('q').focus(); refreshData(); };

// Khởi động ngay: trong khung Apps Script, DOMContentLoaded có thể đã qua trước khi script chạy
try { boot(); } catch (e) { $('grid').innerHTML = '<div class="empty"><b>Lỗi khởi động</b>' + esc(e.message) + '</div>'; }
</script>
</body>
</html>
